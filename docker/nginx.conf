# Minimal gateway so @supabase/supabase-js sees the standard /auth/v1, /rest/v1,
# /storage/v1 layout against a single origin.
events {}
http {
  server {
    listen 8089;
    client_max_body_size 100M;

    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /storage/v1/ {
      proxy_pass http://storage:5000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
